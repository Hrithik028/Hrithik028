<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="145" viewBox="0 0 1100 145" role="img" aria-labelledby="title desc"><title id="title">The Data Forge endures</title><desc id="desc">A blue, gold, and crimson footer for Hrithik's profile.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#16090d"/><stop offset=".25" stop-color="#d7b35c"/><stop offset=".5" stop-color="#123e8f"/><stop offset="1" stop-color="#02050b"/></linearGradient></defs><rect width="1100" height="145" rx="14" fill="url(#bg)"/><rect x="8" y="8" width="1084" height="129" rx="10" fill="#02050b" fill-opacity=".88" stroke="#d7b35c"/><text x="550" y="61" fill="#d7b35c" font-family="Consolas, monospace" font-size="22" font-weight="700" letter-spacing="5" text-anchor="middle">THE DATA FORGE ENDURES.</text><text x="550" y="99" fill="#b8c6dd" font-family="Consolas, monospace" font-size="14" letter-spacing="2" text-anchor="middle">BUILT WITH CURIOSITY · TESTED WITH EVIDENCE · DOCUMENTED FOR THE NEXT TRAVELLER</text></svg>
