name: Update profile statistics

on:
  schedule:
    # Monday morning in Sydney: 07:17 AEST / 08:17 AEDT.
    - cron: "17 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate current public profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Hrithik028
        run: python scripts/update_profile_stats.py

      - name: Commit refreshed statistics
        run: |
          if git diff --quiet -- README.md assets/github-stats.svg; then
            echo "Profile statistics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg
          git commit -m "chore: refresh weekly profile statistics"
          git push
